# Overlay: keep the headless agent, its tools, and its model loop in this
# process, but move the execution world onto a connector. The generic Bash and
# file consumers compose above ctx.fs and ctx.subprocess unchanged, so nothing
# above this overlay knows which machine answers.
#
# As written, the only connector is `local`: the in-process host, which serves
# THIS machine over the same operation set a remote agent serves. That keeps
# the example runnable with no second machine while exercising the whole seam.
#
# To point a session at another machine instead, run on the target
#
#   DSH_CONNECTOR_TOKEN=<secret> dsh-connector-agent --workdir /srv/work
#
# reach it over `ssh -L 8765:127.0.0.1:8765 user@target`, then enable the
# connector-tcp entry below and set `connectors.default` to `build-linux`. A
# Windows target is the same entry with `os: windows` and a `C:\…` workdir; the
# agent confirms both in its handshake and the link is refused when the
# declaration disagrees.
#
# One-world invariant: the connector's workdir and sandbox-policy.workspaceRoot
# must name the same directory in the TARGET's world. For a remote connector
# that is a path on the target, not on this machine.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./advanced.cordis.yml
    patches:
      - id: subprocess
        name: '@deepseek-ai/dsh-subprocess-local'
        disabled: true
      - id: fs-local
        name: '@deepseek-ai/dsh-fs-local'
        disabled: true
      - insert:
          - id: connectors
            name: '@deepseek-ai/dsh-connector'
            config:
              default: local
          - id: connector-host
            name: '@deepseek-ai/dsh-connector-host'
            config:
              id: local
              workdir: !!js process.cwd()
          - id: connector-tcp
            name: '@deepseek-ai/dsh-connector-tcp'
            disabled: true
            config:
              connectors:
                - id: build-linux
                  host: 127.0.0.1
                  port: 8765
                  os: linux
                  workdir: /srv/work
                  tokenEnv: DSH_CONNECTOR_TOKEN
          - id: subprocess-connector
            name: '@deepseek-ai/dsh-subprocess-connector'
          - id: fs-connector
            name: '@deepseek-ai/dsh-fs-connector'
          - id: sandbox-policy
            name: '@deepseek-ai/dsh-sandbox-policy'
            config:
              mode: danger-full-access
              workspaceRoot: !!js process.cwd()
